    <!-- Cross-Platform One-at-a-Time Video Player Engine (Facebook + YouTube) -->
    <script>
      window.__dorponFBPlayers = [];
      window.__pauseYouTube = function () {
        try {
          if (window.__dorponYTPlayer && window.__dorponYTPlayer.pauseVideo) {
            window.__dorponYTPlayer.pauseVideo();
          }
        } catch (e) {}
        try {
          var yt = document.getElementById("yt-player-0");
          if (yt && yt.contentWindow) {
            yt.contentWindow.postMessage(JSON.stringify({ event: "command", func: "pauseVideo", args: "" }), "*");
          }
        } catch (e) {}
      };
      window.__pauseFacebook = function () {
        (window.__dorponFBPlayers || []).forEach(function (entry) {
          try { entry.player.pause(); } catch (e) {}
        });
      };
      window.fbAsyncInit = function () {
        if (!window.FB) return;
        FB.init({ version: "v21.0", xfbml: false });
        var players = window.__dorponFBPlayers;
        function pauseOthers(active) {
          players.forEach(function (entry) {
            if (entry.player !== active) {
              try { entry.player.pause(); } catch (e) {}
            }
          });
          window.__pauseYouTube();
        }
        FB.Event.subscribe("xfbml.ready", function (msg) {
          if (msg.type !== "video") return;
          var entry = { id: msg.id, player: msg.instance };
          players.push(entry);
          var el = document.getElementById(msg.id);
          if (el) {
            el.classList.add("fb-parsed");
            if (el.parentNode) el.parentNode.classList.remove("fb-failed");
          }
          try {
            entry.player.subscribe("startedPlaying", function () {
              try { entry.player.unmute(); } catch (e) {}
              pauseOthers(entry.player);
            });
          } catch (e) {}
        });
      };
      window.onYouTubeIframeAPIReady = function () {
        try {
          window.__dorponYTPlayer = new YT.Player("yt-player-0", {
            events: {
              onStateChange: function (ev) {
                if (ev && ev.data === YT.PlayerState.PLAYING) {
                  window.__pauseFacebook();
                }
              }
            }
          });
        } catch (e) {}
      };
    </script>
